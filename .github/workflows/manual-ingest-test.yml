name: Manual test — soporte-apps ingest

# Throwaway diagnostic workflow, not part of normal CI. Confirms
# INGEST_LEAD_SECRET matches between acaciaco-site and Mission Control,
# from a runner that can actually reach both domains (unlike the sandbox
# this was authored in — see CLAUDE.md's smoke-test section for the same
# network-policy limitation). Manual-dispatch only; removed once the check
# is done.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /api/soporte-apps
        run: |
          curl -sS -i -X POST https://acaciaco.com.mx/api/soporte-apps \
            -H "content-type: application/json" \
            -d '{
              "name": "Prueba INGEST_LEAD_SECRET",
              "email": "h.josepablo@gmail.com",
              "app_interest": "__idea__",
              "message": "Prueba de extremo a extremo desde GitHub Actions — confirmar que INGEST_LEAD_SECRET coincide entre acaciaco-site y Mission Control."
            }'
