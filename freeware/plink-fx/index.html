    transition: background 0.3s;
  }
  /* Premium drifting aurora — soft color fields that slowly breathe.
     Lives on a fixed pseudo-element behind everything for cheap, smooth motion. */
  .app::before {
    content: "";
    position: fixed;
    inset: -25%;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(38% 46% at 18% 20%, oklch(from var(--mx) l c h / 0.30), transparent 70%),
      radial-gradient(36% 44% at 82% 16%, oklch(0.62 0.16 255 / 0.24), transparent 70%),
      radial-gradient(44% 52% at 80% 84%, oklch(from var(--cr) l c h / 0.26), transparent 70%),
      radial-gradient(40% 48% at 20% 82%, oklch(0.66 0.15 330 / 0.22), transparent 70%);
    background-size: 200% 200%;
    filter: saturate(120%);

    will-change: transform, background-position;

  .theme-ink .app::before { filter: saturate(135%) brightness(1.15); }
  @keyframes aurora {

    background: var(--paper-2);
    border-radius: 4px;
  }
  .picker-row-check {
    color: oklch(0.65 0.17 145);
    font-weight: 600;
  }
  .picker-empty {
    padding: 24px 14px;
    text-align: center;
    color: var(--ink-3);
    font-size: 13px;
  }
  .picker-meta {
    margin-top: 8px;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
  }

  /* === Adaptive conv-grid === */
  .conv-grid {
    display: grid;
    gap: 20px;
  }
  .conv-grid.count-1 { grid-template-columns: minmax(0, 560px); justify-content: center; }
  .conv-grid.count-2 { grid-template-columns: 1fr 1fr; }
  .conv-grid.count-3 { grid-template-columns: repeat(3, 1fr); }
  .conv-grid.count-4 { grid-template-columns: repeat(2, 1fr); }
  .conv-empty {
    grid-column: 1 / -1;
    padding: 40px;
    text-align: center;
    color: var(--ink-3);
    border: 1px dashed var(--line-2);
    border-radius: 16px;
  }
  .conv-empty p { margin: 0; }

  .trip-source {
    font-size: 10px;
    color: var(--ink-3);
    margin-top: 4px;
    letter-spacing: 0.04em;
  }
  .region-bar {
    background: var(--paper-2);
    border-bottom: 1px solid var(--line);
  }
  .region-bar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 12px 32px;
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap;
  }
  .region-label {
    font-family: "Space Grotesk", serif;
    font-style: italic;
    font-size: 17px;
    color: var(--ink-2);
  }
  .region-toggle {
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 3px;
    gap: 2px;
  }
  .region-btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: none; background: transparent;
    padding: 6px 12px 6px 6px;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    border-radius: 9px;
    font-family: inherit;
    transition: all 0.15s;
  }
  .region-btn:hover { background: var(--paper-2); color: var(--ink); }
  .region-btn.active {
    background: var(--ink);
    color: var(--paper);
  }
  .region-btn.active .region-code { color: var(--paper); opacity: 0.7; }
  .region-code {
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.05em;
    padding-left: 4px;
    border-left: 1px solid oklch(from currentColor l c h / 0.2);
  }
  .region-auto {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-left: auto;
  }
  .auto-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: oklch(0.65 0.17 145);
    box-shadow: 0 0 0 3px oklch(0.65 0.17 145 / 0.15);
  }
  .region-reset {
    margin-left: auto;
    font-size: 11px;
    color: var(--ink-3);
    background: transparent;
    border: none;
    padding: 4px 8px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--line-2);
    font-family: inherit;
  }
  .region-reset:hover { color: var(--ink); text-decoration-color: var(--ink-3); }

  /* === Main === */
  .main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 32px 80px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* Amount input */
  .amount-section { }
  .amount-label {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .amount-label > span {
    font-family: "Space Grotesk", serif;
    font-style: italic;
    font-size: 22px;
    color: var(--ink-2);
  }
  .dir-toggle {
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .dir-btn {
    border: none; background: transparent;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-3);
    cursor: pointer;
    border-radius: 999px;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    font-family: inherit;
  }
  .dir-btn:hover { color: var(--ink); }
  .dir-btn.active { background: var(--accent, var(--ink)); color: var(--paper); }

  .amount-input-wrap {
    display: flex; align-items: baseline; gap: 16px;
    padding: 22px 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .amount-input-wrap.focused {
    border-color: var(--ink-2);
    box-shadow: 0 0 0 4px oklch(from var(--ink) l c h / 0.06), var(--shadow);
  }
  .amount-symbol {
    font-family: "Space Grotesk", serif;
    font-size: 56px;
    color: var(--ink-3);
    font-weight: 400;
    line-height: 1;
  }
  .amount-input {
    flex: 1;
    font-size: 56px;
    font-weight: 500;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    padding: 0;
    line-height: 1;
    min-width: 0;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .amount-code {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    padding: 4px 10px;
    background: var(--paper-2);
    border-radius: 6px;
  }

  /* Quick chips */
  .chips {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 14px;
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-family: "Space Grotesk", monospace;
    cursor: pointer;
    transition: all 0.12s;
  }
  .chip:hover { border-color: var(--ink-3); color: var(--ink); }
  .chip.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* === Conversion card === */
  .conv-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 18px;
    position: relative;
    overflow: hidden;
    animation: card-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease;
  }
  .conv-card:nth-child(1) { animation-delay: 0.06s; }
  .conv-card:nth-child(2) { animation-delay: 0.13s; }
  .conv-card:nth-child(3) { animation-delay: 0.20s; }
  .conv-card:nth-child(4) { animation-delay: 0.27s; }
  .conv-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 40px -22px oklch(0.20 0.015 60 / 0.45), var(--shadow);
  }
  @keyframes card-rise {
    from { opacity: 0; transform: translateY(20px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }
  .conv-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    opacity: 0.6;
  }
  .conv-card.is-home {
    border-color: oklch(from var(--accent) l c h / 0.4);
    box-shadow: 0 0 0 2px oklch(from var(--accent) l c h / 0.08), var(--shadow);
  }
  .home-tag {
    position: absolute;
    top: 14px;
    right: 14px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    background: oklch(from var(--accent) l c h / 0.10);
    padding: 4px 8px;
    border-radius: 999px;
  }
  .conv-head {
    display: flex; align-items: center; gap: 14px;
  }
  .conv-meta { flex: 1; }
  .conv-name {
    font-family: "Space Grotesk", serif;
    font-size: 22px;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 4px;
    text-wrap: balance;
  }
  .conv-code {
    font-size: 12px;
    color: var(--ink-3);
    display: flex; align-items: center; gap: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .conv-rate {
    color: var(--ink-2);
    letter-spacing: 0;
    text-transform: none;
    font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse2 2.2s ease-out infinite;
  }
  @keyframes pulse2 {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  .conv-amount {
    display: flex; align-items: baseline; gap: 10px;
    padding: 8px 0 6px;
  }
  .conv-symbol {
    font-family: "Space Grotesk", serif;
    font-size: 32px;
    color: var(--ink-3);
  }
  .conv-big {
    font-family: "Space Grotesk", ui-monospace, monospace;
    font-size: 52px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .conv-cur {
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .conv-foot {
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    font-size: 12px;
    color: var(--ink-3);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .conv-foot-label { color: var(--ink-3); }
  .conv-foot .mono { color: var(--ink-2); }
  .dot { color: var(--line-2); padding: 0 2px; }

  /* === Budget === */
  .budget {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
  }
  .budget-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 16px;
  }
  .budget-label {
    font-size: 11px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .budget-amounts {
    display: flex; align-items: baseline; gap: 8px;
  }
  .budget-spent { font-size: 28px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
  .budget-of { color: var(--ink-3); font-size: 14px; }
  .budget-total { color: var(--ink-2); font-size: 18px; font-variant-numeric: tabular-nums; }
  .budget-code {
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    padding: 2px 7px;
    background: var(--paper-2);
    border-radius: 5px;
    margin-left: 2px;
    align-self: center;
  }
  .budget-right { text-align: right; }
  .budget-remain { font-size: 24px; font-weight: 500; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }

  .budget-bar {
    position: relative;
    height: 14px;
    background: var(--paper-2);
    border-radius: 7px;
    overflow: hidden;
    margin-bottom: 22px;
    border: 1px solid var(--line);
  }
  .budget-fill {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, var(--mx), var(--cr));
    border-radius: 7px;
    transition: width 0.3s;
  }
  .budget-fill-pending {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: repeating-linear-gradient(
      45deg,
      oklch(from var(--ink) l c h / 0.10),
      oklch(from var(--ink) l c h / 0.10) 4px,
      transparent 4px,
      transparent 8px
    );
    border-radius: 7px;
    transition: width 0.3s;
    pointer-events: none;
  }
  .budget-tick {
    position: absolute;
    top: 100%;
    transform: translateX(-50%);
    margin-top: 6px;
    font-size: 10px;
    color: var(--ink-3);
    font-family: "Space Grotesk", monospace;
    font-variant-numeric: tabular-nums;
  }
  .budget-tick::before {
    content: "";
    position: absolute;
    bottom: 100%;
    left: 50%;
    width: 1px; height: 4px;
    background: var(--line-2);
  }

  .budget-foot {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    font-size: 13px;
    color: var(--ink-2);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .budget-hint { color: var(--ink-3); }
  .budget-after { color: var(--ink); font-weight: 500; }

  /* === Costs === */
  .section-head { margin-bottom: 20px; }
  .section-head h2 {
    font-family: "Space Grotesk", serif;
    font-size: 28px;
    font-weight: 400;
    line-height: 1.1;
    margin: 0 0 4px;
    color: var(--ink);
    text-wrap: balance;
  }
  .section-head p {
    margin: 0;
    color: var(--ink-3);
    font-size: 14px;
  }
  .costs-grid {
    display: grid;
    gap: 24px;
  }
  .costs-grid.count-1 { grid-template-columns: minmax(0, 560px); justify-content: center; }
  .costs-grid.count-2 { grid-template-columns: 1fr 1fr; }
  .costs-grid.count-3 { grid-template-columns: repeat(3, 1fr); }
  .costs-grid.count-4 { grid-template-columns: repeat(2, 1fr); }
  .costs-col {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .costs-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 12px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .costs-title {
    font-family: "Space Grotesk", serif;
    font-size: 19px;
    font-style: italic;
    color: var(--ink);
  }
  .costs-sub {
    font-size: 12px;
    color: var(--ink-3);
  }
  .cost-row {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    gap: 10px;
    align-items: center;
    padding: 10px 0;
    font-size: 13px;
    border-bottom: 1px dashed var(--line);
  }
  .cost-row:last-child { border-bottom: none; }
  .cost-icon {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: oklch(from var(--accent) l c h / 0.12);
    color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "Space Grotesk", serif;
    font-size: 12px;
    font-weight: 400;
  }
  .cost-label { color: var(--ink); }
  .cost-price { color: var(--ink-3); font-size: 12px; }
  .cost-qty {
    color: var(--ink-2);
    font-weight: 500;
    font-size: 13px;
    min-width: 50px;
    text-align: right;
  }
  .cost-qty .mono { font-size: 14px; color: var(--ink); }

  /* Footer */
  .foot {
    display: flex; justify-content: center; gap: 10px;
    color: var(--ink-3);
    font-size: 12px;
    padding-top: 8px;
  }
  .foot-sep { color: var(--line-2); }

  /* === Auth === */
  .auth-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .auth-btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .auth-avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--mx), var(--cr));
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    text-transform: uppercase;
    overflow: hidden;
  }
  .auth-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .auth-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 220px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 12px 40px -8px oklch(0.20 0.015 60 / 0.18);
    z-index: 100;
    padding: 8px;
    animation: pop-in 0.16s ease-out;
  }
  .auth-menu-email {
    font-size: 11px;
    color: var(--ink-3);
    padding: 6px 8px 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
    word-break: break-all;
  }
  .auth-menu-item {
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 8px;
    border-radius: 6px;
    color: var(--ink);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .auth-menu-item:hover { background: var(--paper-2); }
  .auth-menu-item.muted { color: var(--ink-3); font-size: 11px; cursor: default; }
  .auth-menu-item.muted:hover { background: transparent; }
  .auth-wrap { position: relative; }

  .auth-overlay {
    position: fixed;
    inset: 0;
    background: oklch(0.20 0.015 60 / 0.45);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: pop-in 0.16s ease-out;
  }
  .auth-modal {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 20px 60px -16px oklch(0.20 0.015 60 / 0.4);
    width: 100%;
    max-width: 380px;
    padding: 28px 28px 24px;
    position: relative;
  }
  .auth-modal-close {
    position: absolute;
    top: 12px; right: 12px;
    background: transparent;
    border: none;
    color: var(--ink-3);
    width: 28px; height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
    font-family: inherit;
  }
  .auth-modal-close:hover { background: var(--paper-2); color: var(--ink); }
  .auth-modal h2 {
    font-family: "Space Grotesk", serif;
    font-size: 24px;
    font-weight: 400;
    line-height: 1.1;
    margin: 0 0 4px;
    color: var(--ink);
    text-wrap: balance;
  }
  .auth-modal p {
    margin: 0 0 20px;
    color: var(--ink-3);
    font-size: 13px;
  }
  .auth-google {
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .auth-google:hover { border-color: var(--ink-3); background: var(--card); }
  .auth-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--ink-3);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 16px 0;
  }
  .auth-divider::before, .auth-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .auth-field {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    margin-bottom: 10px;
    transition: border-color 0.15s;

  .auth-field:focus { border-color: var(--ink-2); }
  .auth-submit {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .auth-submit:hover { opacity: 0.85; }
  .auth-submit:disabled { opacity: 0.5; cursor: wait; }
  .auth-toggle {
    background: none;
    border: none;
    color: var(--ink-3);
    font-size: 12px;
    cursor: pointer;
    margin-top: 10px;
    text-align: center;
    width: 100%;
    font-family: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--line-2);
  }
  .auth-toggle:hover { color: var(--ink); }
  .auth-error {
    color: oklch(0.55 0.18 25);
    font-size: 12px;
    margin: 0 0 10px;
    min-height: 16px;
  }
  .auth-note {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 14px;
    text-align: center;
    line-height: 1.5;
  }

  /* === Cookie consent === */
  .cookie-banner {
    position: fixed;
    inset: 0;
    z-index: 150;
    display: flex; align-items: center; justify-content: center;
    background: oklch(0.20 0.015 60 / 0.35);
    padding: 20px;
    animation: pop-in 0.2s ease-out;
  }
  .cookie-banner-inner {
    display: flex; flex-direction: column; gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 24px 60px -16px oklch(0.20 0.015 60 / 0.5);
    padding: 26px 26px 22px;
    max-width: 420px;
    width: 100%;
  }
  .cookie-banner-title {
    font-family: "Space Grotesk", serif;
    font-size: 22px;
    color: var(--ink);
    line-height: 1.1;
    text-wrap: balance;
  }
  .cookie-banner-text {
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .cookie-banner-text strong { color: var(--ink); font-weight: 600; }
  .cookie-accept {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
    align-self: flex-start;
  }
  .cookie-accept:hover { opacity: 0.85; }

  /* === Budget opt-in / summary === */
  .budget-cta, .trip-summary {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px 26px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 12px;
  }
  .budget-cta-title, .trip-summary-title {
    font-family: "Space Grotesk", serif;
    font-size: 24px;
    color: var(--ink);
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }
  .budget-cta-desc {
    color: var(--ink-2);
    font-size: 14px;
    margin: 0;
    line-height: 1.5;
  }
  .budget-cta-note {
    color: var(--ink-3);
    font-size: 12px;
    margin: 6px 0 0;
    line-height: 1.5;
    padding: 10px 12px;
    background: var(--paper-2);
    border-radius: 10px;
    border-left: 3px solid var(--mx);
  }
  .budget-cta-actions {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-top: 6px;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-ghost {
    background: transparent;
    color: var(--ink-2);
    border: 1px solid var(--line);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-ghost:hover { border-color: var(--ink-3); color: var(--ink); }

  /* === Expiry notice (in-budget banner) === */
  .expiry-notice {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--mx);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--ink-2);
    margin-bottom: 14px;
  }
  .expiry-notice strong { color: var(--ink); }
  .expiry-icon { color: var(--mx); flex-shrink: 0; }

  /* === Trip summary (post-end overlay) === */
  .summary-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: oklch(0.20 0.015 60 / 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: pop-in 0.2s ease-out;
  }
  .summary-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 24px 60px -16px oklch(0.20 0.015 60 / 0.5);
    max-width: 520px;
    width: 100%;
    padding: 28px 30px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .summary-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-3);
  }
  .summary-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 18px;
    font-size: 14px;
    padding: 6px 0;
  }
  .summary-grid dt { color: var(--ink-3); }
  .summary-grid dd { margin: 0; color: var(--ink); font-weight: 500; }
  .summary-actions {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-top: 6px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .summary-note {
    font-size: 11px;
    color: var(--ink-3);
    margin: 0;
    line-height: 1.5;
  }

  .foot-heart { color: oklch(0.62 0.18 25); }
  .foot-link {
    color: var(--ink-2);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--line-2);
    transition: color 0.15s, text-decoration-color 0.15s;
  }
  .foot-link:hover { color: var(--ink); text-decoration-color: var(--ink-3); }

  /* ══════════════════════════════════════════
     RESPONSIVE — tablet  ≤ 820px
  ══════════════════════════════════════════ */
  @media (max-width: 820px) {
    .trip-header {
      grid-template-columns: 1fr auto;
      grid-template-areas: "mark rates" "info info";
      gap: 10px 12px;
      padding: 20px 28px 16px;
    }
    .trip-mark  { grid-area: mark; justify-content: flex-start; }
    .trip-rates { grid-area: rates; flex-direction: row; align-items: center; gap: 8px; }
    .trip-info  { grid-area: info; }
    .trip-rates-grid { display: none; }
    .trip-source     { display: none; }

    .picker-bar-inner { padding: 14px 28px; gap: 12px; }
    .region-bar-inner { padding: 10px 28px; }

    .main { padding: 28px 28px 80px; gap: 28px; }

    .conv-grid,
    .conv-grid.count-2,
    .conv-grid.count-3,
    .conv-grid.count-4 { grid-template-columns: 1fr; }
    .costs-grid,
    .costs-grid.count-2,
    .costs-grid.count-3,
    .costs-grid.count-4 { grid-template-columns: 1fr; }

    .amount-input  { font-size: 46px; line-height: 1; }
    .amount-symbol { font-size: 46px; line-height: 1; }
    .conv-big      { font-size: 44px; line-height: 1; }
  }

  /* ══════════════════════════════════════════
     RESPONSIVE — phone  ≤ 640px
     Premium mobile-first experience
  ══════════════════════════════════════════ */
  @media (max-width: 640px) {

    /* iOS: prevent auto-zoom when tapping inputs */
    input, textarea, select { font-size: max(16px, 1em); }

    /* ── Header ──────────────────────────────── */
    .trip-header {
      grid-template-columns: 1fr auto;
      grid-template-areas: "mark rates" "info info";
      gap: 10px 8px;
      padding: 16px 20px 14px;
      padding-top: max(16px, env(safe-area-inset-top));
    }
    .trip-mark  { grid-area: mark; font-size: 19px; align-items: center; }
    .trip-rates { grid-area: rates; flex-direction: row; align-items: center; gap: 6px; }
    .trip-info  { grid-area: info; text-align: center; }
    .trip-name  { font-size: 19px; margin-bottom: 6px; }
    .trip-route { justify-content: center; gap: 6px; }
    .trip-rates-grid { display: none; }
    .trip-source     { display: none; }
    /* Rate refresh: show only the pulse dot + status word */
    .rate-refresh { padding: 5px 9px; font-size: 10px; min-height: 34px; gap: 5px; letter-spacing: 0; }
    .auth-btn    { padding: 5px 10px; min-height: 34px; font-size: 11px; gap: 5px; }
    .auth-avatar { width: 20px; height: 20px; font-size: 10px; }

    /* Editable trip name hint on mobile */
    .trip-edit { border-bottom: 1px solid var(--line); border-radius: 0; padding: 2px 4px; }
    .trip-edit:focus { border-bottom-color: var(--ink-3); background: transparent; }

    /* ── Currency tracking (picker) bar ─────── */
    .picker-bar-inner {
      padding: 10px 20px;
      gap: 8px;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
    }
    .picker-label { padding-top: 0; min-width: 0; }
    .picker-label-title { font-size: 15px; }
    .picker-label-sub   { display: none; }
    /* Compact chips: hide full name, just flag + code */
    .picker-chip      { padding: 6px 6px 6px 8px; gap: 5px; }
    .picker-chip-name { display: none; }
    .picker-chip-x    { width: 28px; height: 28px; font-size: 16px; }
    .picker-add       { min-height: 40px; padding: 7px 13px; font-size: 12px; }

    /* ── "I'm in" region bar ────────────────── */
    .region-bar-inner {
      padding: 8px 20px;
      overflow-x: auto;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      gap: 8px;
    }
    .region-bar-inner::-webkit-scrollbar { display: none; }
    .region-label  { flex-shrink: 0; font-size: 14px; font-style: italic; }
    .region-toggle { flex-shrink: 0; padding: 2px; }
    .region-btn    { min-height: 40px; padding: 6px 12px 6px 7px; font-size: 12px; gap: 6px; }
    .region-code   { font-size: 10px; }
    .region-auto, .region-reset { flex-shrink: 0; }

    /* ── Main content ───────────────────────── */
    .main {
      padding: 22px 20px max(88px, calc(72px + env(safe-area-inset-bottom)));
      gap: 20px;
    }

    /* ── Amount input — immersive hero ────── */
    .amount-label > span { font-size: 17px; }
    .dir-toggle { padding: 2px; }
    .dir-btn    { min-height: 34px; padding: 5px 11px; font-size: 11px; }

    .amount-input-wrap {
      padding: 20px 20px;
      border-radius: 22px;
      border-color: oklch(from var(--accent, var(--mx)) l c h / 0.22);
      box-shadow:
        0 4px 28px -8px oklch(from var(--accent, var(--mx)) l c h / 0.14),
        0 1px 0 var(--line);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .amount-input-wrap.focused {
      border-color: oklch(from var(--accent, var(--mx)) l c h / 0.5);
      box-shadow:
        0 0 0 4px oklch(from var(--accent, var(--mx)) l c h / 0.10),
        0 4px 28px -8px oklch(from var(--accent, var(--mx)) l c h / 0.20);
    }
    .amount-symbol { font-size: 40px; line-height: 1; }
    .amount-input  { font-size: 52px; line-height: 1; }
    .amount-code   { font-size: 12px; padding: 4px 9px; }

    /* ── Quick amount chips ─────────────────── */
    .chips {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
      gap: 6px;
      margin-top: 10px;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      padding: 0 15px;
      font-size: 13px;
    }

    /* ── Conversion cards — GROUPED LIST ────── */
    /* The grid itself becomes the card container */
    .conv-grid,
    .conv-grid.count-2,
    .conv-grid.count-3,
    .conv-grid.count-4 {
      grid-template-columns: 1fr;
      gap: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    /* Each card is now a horizontal row */
    .conv-card {
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 14px 18px 14px 20px;
      border-radius: 0;
      border: none;
      border-bottom: 1px solid var(--line);
      box-shadow: none;
      background: transparent;
      min-height: 70px;
      position: relative;
    }
    .conv-card:last-child { border-bottom: none; }

    /* Accent: convert top stripe → left stripe */
    .conv-card::before {
      right: auto;
      bottom: 0;
      width: 3px;
      height: auto;
      border-radius: 0;
      opacity: 0.85;
    }

    /* Home currency: subtle tint */
    .conv-card.is-home {
      background: oklch(from var(--accent) l c h / 0.045);
      border-color: transparent;
      border-bottom: 1px solid var(--line);
    }
    .conv-card.is-home:last-child { border-bottom: none; }
    .home-tag {
      position: absolute;
      top: 8px; right: 14px;
      font-size: 8px;
      padding: 2px 6px;
    }

    /* Left side: flag + meta */
    .conv-head { flex: 1; min-width: 0; gap: 10px; }
    .conv-meta { min-width: 0; }
    .conv-name { font-size: 14px; font-family: "Space Grotesk", sans-serif; margin-bottom: 1px; line-height: 1.2; }
    .conv-code { font-size: 11px; gap: 5px; }
    .conv-rate { font-size: 10px; }

    /* Right side: amount, stacked */
    .conv-amount {
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      gap: 1px;
    }
    .conv-symbol { display: none; }  /* removed — crowded; symbol lives in conv-cur accent */
    .conv-big    { font-size: 26px; letter-spacing: -0.01em; line-height: 1.1; }
    .conv-cur    { font-size: 10px; letter-spacing: 0.09em; font-weight: 600; color: var(--accent); opacity: 0.85; }

    /* Hide the exchange-rate footer — too noisy on mobile */
    .conv-foot { display: none; }

    /* Empty state */
    .conv-empty { padding: 28px 20px; }

    /* ── Budget card ────────────────────────── */
    .budget { padding: 18px 20px; border-radius: 20px; }
    .budget-spent  { font-size: 22px; }
    .budget-remain { font-size: 20px; }
    .budget-total  { font-size: 15px; }
    .budget-of     { font-size: 12px; }
    .budget-label  { font-size: 9px; }
    .budget-foot   { font-size: 12px; gap: 6px; }

    /* ── Budget opt-in ──────────────────────── */
    .budget-cta { padding: 20px 20px; border-radius: 20px; }
    .budget-cta-title { font-size: 20px; }
    .budget-cta-actions { flex-direction: column; gap: 8px; margin-top: 4px; }
    .btn-primary, .btn-ghost {
      width: 100%;
      min-height: 50px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    /* ── Costs section ──────────────────────── */
    .section-head h2 { font-size: 22px; }
    .section-head p  { font-size: 12px; }
    .costs-col { padding: 16px; border-radius: 16px; }
    .cost-row  { padding: 9px 0; gap: 8px; }

    /* ── Trip summary overlay ───────────────── */
    .summary-card { padding: 24px 20px 20px; border-radius: 22px 22px 0 0; }
    .summary-actions { flex-direction: column; gap: 8px; }

    /* ════════════════════════════════════════
       BOTTOM SHEETS — calendar + picker
    ════════════════════════════════════════ */

    /* Shared bottom-sheet drag handle via ::before */
    .dp-pop::before,
    .picker-pop::before {
      content: "";
      display: block;
      width: 36px; height: 4px;
      background: var(--line-2);
      border-radius: 2px;
      margin: 16px auto 10px;
      flex-shrink: 0;
    }

    /* ── Date-range picker ── */
    .dp-pop {
      position: fixed;
      inset: auto 0 0 0;
      top: auto !important;
      left: 0 !important;
      right: 0 !important;
      transform: none !important;
      width: 100%;
      min-width: 0;
      border-radius: 28px 28px 0 0;
      border-bottom: none;
      padding: 0 20px max(28px, env(safe-area-inset-bottom));
      max-height: 88vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 99;
      animation: slide-up 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .dp-head    { padding: 0 0 14px; }
    .dp-head-label { font-size: 16px; }
    .dp-months  { grid-template-columns: 1fr; gap: 4px; }
    .dp-nav-btn { width: 44px; height: 44px; font-size: 20px; border-radius: 10px; }
    .dp-cell    { height: 42px; font-size: 14px; border-radius: 8px; }
    .dp-cell.is-start { border-radius: 999px 0 0 999px; }
    .dp-cell.is-end   { border-radius: 0 999px 999px 0; }
    .dp-cell.is-single { border-radius: 999px; }
    .dp-foot    { margin-top: 16px; padding-top: 12px; }
    .dp-done    { padding: 9px 18px; font-size: 13px; }

    /* ── Currency picker ── */
    .picker-pop {
      position: fixed;
      inset: auto 0 0 0;
      top: auto !important;
      left: 0 !important;
      right: 0 !important;
      width: 100%;
      max-width: none;
      border-radius: 28px 28px 0 0;
      border-bottom: none;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      max-height: 80vh;
      z-index: 99;
      animation: slide-up 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .picker-pop-head { padding: 10px 18px 10px; }
    .picker-search   { font-size: 16px; }
    .picker-row      { min-height: 52px; padding: 10px 18px; }
    .picker-row-name { font-size: 13px; }

    /* ── Blurred backdrop ───────────────────── */
    .mobile-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 98;
      background: oklch(0.10 0.01 60 / 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: fade-in 0.22s ease-out;
    }

    /* ── Auth modal + cookie: bottom sheet ──── */
    .auth-overlay { padding: 0; align-items: flex-end; animation: fade-in 0.22s ease-out; }
    .auth-modal {
      border-radius: 28px 28px 0 0;
      max-width: 100%;
      padding-bottom: max(30px, env(safe-area-inset-bottom));
      animation: slide-up 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cookie-banner { align-items: flex-end; padding: 0; }
    .cookie-banner-inner {
      border-radius: 28px 28px 0 0;
      max-width: 100%;
      padding-bottom: max(28px, env(safe-area-inset-bottom));
    }

    /* Summary overlay: anchored to bottom */
    .summary-overlay { align-items: flex-end; padding: 0; }
  }

  /* ══════════════════════════════════════════
     RESPONSIVE — small phone  ≤ 390px
  ══════════════════════════════════════════ */
  @media (max-width: 390px) {
    .trip-mark     { font-size: 16px; }
    .trip-name     { font-size: 17px; }
    .amount-input  { font-size: 44px; line-height: 1; }
    .amount-symbol { font-size: 34px; line-height: 1; }
    .conv-big      { font-size: 22px; }
    .budget-cta-title { font-size: 18px; }
    .main              { padding-inline: 14px; }
    .picker-bar-inner  { padding-inline: 14px; }
    .region-bar-inner  { padding-inline: 14px; }
    .trip-header       { padding-inline: 14px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.46.1/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

  <script type="text/babel" src="/freeware/plink-fx/tweaks-panel.jsx"></script>
  <script type="text/babel" src="/freeware/plink-fx/app.jsx"></script>
</body>
</html>
