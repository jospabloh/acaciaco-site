<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="CatequesisQR">
  <defs>
    <linearGradient id="cq-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c4450"/>
      <stop offset="100%" stop-color="#0f2830"/>
    </linearGradient>
  </defs>

  <!-- Ficha / tarjetita de asistencia, esquinas redondeadas -->
  <rect x="64" y="64" width="896" height="896" rx="140" fill="url(#cq-ink)"/>

  <!-- Patrones "finder" de QR en las tres esquinas, en dorado -->
  <g fill="none" stroke="#c99a44" stroke-width="42">
    <rect x="180" y="180" width="220" height="220" rx="28"/>
    <rect x="624" y="180" width="220" height="220" rx="28"/>
    <rect x="180" y="624" width="220" height="220" rx="28"/>
  </g>
  <g fill="#c99a44">
    <rect x="248" y="248" width="84" height="84" rx="10"/>
    <rect x="692" y="248" width="84" height="84" rx="10"/>
    <rect x="248" y="692" width="84" height="84" rx="10"/>
  </g>

  <!-- Sello "presente": check dentro de la cuarta esquina -->
  <path d="M700 706l58 58 108-124" fill="none" stroke="#e7c67a" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
